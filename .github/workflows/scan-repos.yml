name: 레포 스캔

# 매주 월요일 09:00(서울)에 GitHub 레포를 훑어 장부의 프로젝트·서비스 연결을 채운다.
# 필요한 시크릿: LEDGER_SCAN_TOKEN — data/scan-config.json 의 owners 레포를 읽을 수 있는 토큰
#   (classic PAT의 repo 범위가 가장 간단. fine-grained를 쓰면 개인용 LEDGER_SCAN_TOKEN + 회사 조직용 LEDGER_SCAN_TOKEN_ORG)
# 시크릿 없이 쓰려면: Claude에게 "장부 정리해 줘" (gh 로그인으로 같은 스캔을 돌린다)
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  scan:
    # 템플릿 레포 자체에서는 돌리지 않는다 (템플릿으로 만든 레포에서만)
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 토큰 확인
        id: tok
        env:
          T: ${{ secrets.LEDGER_SCAN_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::LEDGER_SCAN_TOKEN 시크릿이 없어서 건너뛰어요. README의 '자동 갱신' 절을 보세요."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 레포 훑기
        if: steps.tok.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.LEDGER_SCAN_TOKEN }}
          GH_TOKEN_ORG: ${{ secrets.LEDGER_SCAN_TOKEN_ORG }}
        run: node scripts/scan-repos.mjs
      - name: 바뀐 내용 커밋
        if: steps.tok.outputs.skip != '1'
        run: |
          git config user.name "ledger-scan[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/scan-report.md
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "장부: 레포 스캔 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && continue
          done
          exit 1
