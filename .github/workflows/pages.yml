name: 장부 페이지 배포

# docs/ 폴더(장부 페이지)만 GitHub Pages로 배포한다. 데이터(data/)는 올리지 않는다.
# 페이지는 열 때 GitHub 토큰으로 프라이빗 레포의 data/ledger.json을 읽는다.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 템플릿 레포 자체에서는 돌리지 않는다 (템플릿으로 만든 레포에서만)
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
